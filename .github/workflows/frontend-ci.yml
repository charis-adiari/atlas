name: Frontend CI

on:
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
    paths:
      - 'ui/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - main
      - develop
      - 'release/**'
    paths:
      - 'ui/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      # - name: Run Tests
      #   run: npm test

      - name: Build Project
        run: npm run build