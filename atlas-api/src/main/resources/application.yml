app:
  log-format: "%d{HH:mm:ss,SSS} %-5p [%c{1.}] %X{correlationId} %s%e%n"
  auth:
    issuer: atlas
    token-ttl: PT1H
    bcrypt-cost: 12
    verification-token-lifetime: PT24H
    resend-verification:
      per-email-limit: 3
      per-client-address-limit: 20
      window: PT1H

smallrye:
  jwt:
    sign:
      key: ${ACCESS_TOKEN_PRIVATE_KEY}

mp:
  jwt:
    verify:
      publickey: ${ACCESS_TOKEN_PUBLIC_KEY}
      issuer: ${app.auth.issuer}

quarkus:
  jackson:
    accept-case-insensitive-enums: true
  mailer:
    from: noreply@musketeers.com
  http:
    port: 8080
    test-port: 0
    cors:
      enabled: true
      origins: https://musketeers.com
      methods: GET,POST,PUT,DELETE,OPTIONS
      headers: Content-Type,Authorization,X-Correlation-ID
      exposed-headers: X-Correlation-ID
      access-control-max-age: 24H
  flyway:
    migrate-at-start: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rest:
    path: /api/v1
  smallrye-openapi:
    info-title: Atlas
    info-version: 1.0.0
    security-scheme: jwt
  hibernate-orm:
    jdbc:
      statement-batch-size: 100
  datasource:
    db-kind: postgresql
  console:
    color: false
  log:
    level: INFO
    console:
      format: ${app.log-format}
    file:
      format: ${app.log-format}

"%dev":
  app:
    auth:
      verification-page-address: http://localhost:3000/verify-email
  quarkus:
    http:
      cors:
        origins: http://localhost:5173
    datasource:
      username: ${DB_USER:user}
      password: ${DB_PASSWORD:password}
      jdbc:
        url: ${DB_URL}
    hibernate-orm:
      log:
        sql: true
        format-sql: true
    console:
      color: true

"%test":
  app:
    auth:
      bcrypt-cost: 4
      verification-page-address: http://localhost:3000/verify-email
  smallrye:
    jwt:
      sign:
        key: ""
  mp:
    jwt:
      verify:
        publickey: ""

"%prod":
  app:
    auth:
      verification-page-address: ${VERIFICATION_PAGE_ADDRESS}
  quarkus:
    mailer:
      host: ${MAIL_HOST}
      port: ${MAIL_PORT}
      username: ${MAIL_USER}
      password: ${MAIL_PASSWORD}
      start-tls: REQUIRED
    datasource:
      username: ${DB_USER}
      password: ${DB_PASSWORD}
      jdbc:
        url: ${DB_URL}
    log:
      console:
      file:
        path: "./logs/app.log" #TODO: Fix when we spin up prod environment
        rotation:
          max-file-size: 10M
          max-backup-index: 5
          file-suffix: .yyyy-MM-dd
