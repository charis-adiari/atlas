app:
  log-format: "%d{HH:mm:ss,SSS} %-5p [%c{1.}] %X{correlationId} %s%e%n"

quarkus:
  http:
    port: 8080
    test-port: 0
    cors:
      enabled: true
      origins: https://musketeers.com
      methods: GET,POST,PUT,DELETE,OPTIONS
      headers: Content-Type,Authorization,X-Correlation-ID
      exposed-headers: X-Correlation-ID
      access-control-max-age: 24H
  flyway:
    migrate-at-start: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rest:
    path: /api/v1
  smallrye-openapi:
    info-title: Atlas
    info-version: 1.0.0
  datasource:
    db-kind: postgresql
  console:
    color: false
  log:
    level: INFO
    console:
      format: ${app.log-format}
    file:
      format: ${app.log-format}

"%dev":
  quarkus:
    http:
      cors:
        origins: http://localhost:5173
    datasource:
      username: ${DB_USER:user}
      password: ${DB_PASSWORD:password}
      jdbc:
        url: ${DB_URL}
    hibernate-orm:
      log:
        sql: true
        format-sql: true
    console:
      color: true

"%prod":
  quarkus:
    datasource:
      username: ${DB_USER}
      password: ${DB_PASSWORD}
      jdbc:
        url: ${DB_URL}
    log:
      console:
      file:
        path: "./logs/app.log" #TODO: Fix when we spin up prod environment
        rotation:
          max-file-size: 10M
          max-backup-index: 5
          file-suffix: .yyyy-MM-dd
