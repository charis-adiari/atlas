quarkus:
  http:
    port: 8080
  flyway:
    migrate-at-start: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rest:
    path: /api/v1
  smallrye-openapi:
    info-title: Atlas
    info-version: 1.0.0
  datasource:
    db-kind: postgresql

"%dev":
  quarkus:
    datasource:
      username: ${DB_USER:user}
      password: ${DB_PASSWORD:password}
      jdbc:
        url: ${DB_URL}
    hibernate-orm:
      log:
        sql: true
        format-sql: true

"%prod":
  quarkus:
    datasource:
      username: ${DB_USER}
      password: ${DB_PASSWORD}
      jdbc:
        url: ${DB_URL}
