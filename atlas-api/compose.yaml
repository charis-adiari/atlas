services:
  atlas-db:
    image: postgres:18
    container_name: atlas-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432" #HOST_PORT:CONTAINER_PORT
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  db_data:
    name: atlas_db_data